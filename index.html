<!DOCTYPE html>
<html>

<head>

    <title>GARDNER COLLEGE LIBRARY- Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2742, #1f4e79, #102a43);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* ANIMATED LIBRARY BACKGROUND */

        body::before {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            top: -100px;
            left: -80px;
            animation: float1 8s infinite ease-in-out;
        }

        body::after {
            content: "";
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(255, 255, 255, 0.07);
            border-radius: 50%;
            bottom: -150px;
            right: -100px;
            animation: float2 10s infinite ease-in-out;
        }

        @keyframes float1 {

            0% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(60px, 40px);
            }

            100% {
                transform: translate(0, 0);
            }

        }

        @keyframes float2 {

            0% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(-50px, -40px);
            }

            100% {
                transform: translate(0, 0);
            }

        }


        /* FLOATING BOOK SHAPES */

        .login-box::before {
            content: "";
            position: absolute;
            width: 70px;
            height: 90px;
            border: 2px solid rgba(255,255,255,0.12);
            border-radius: 5px;
            left: -250px;
            top: 100px;
            transform: rotate(-15deg);
            animation: book1 6s infinite ease-in-out;
        }

        .login-box::after {
            content: "";
            position: absolute;
            width: 65px;
            height: 85px;
            border: 2px solid rgba(255,255,255,0.12);
            border-radius: 5px;
            right: -240px;
            bottom: 80px;
            transform: rotate(15deg);
            animation: book2 7s infinite ease-in-out;
        }

        @keyframes book1 {

            0% {
                transform: translateY(0) rotate(-15deg);
            }

            50% {
                transform: translateY(-35px) rotate(-5deg);
            }

            100% {
                transform: translateY(0) rotate(-15deg);
            }

        }

        @keyframes book2 {

            0% {
                transform: translateY(0) rotate(15deg);
            }

            50% {
                transform: translateY(30px) rotate(25deg);
            }

            100% {
                transform: translateY(0) rotate(15deg);
            }

        }


        .login-box {
            width: 400px;
            background: rgba(255,255,255,0.96);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.30);
            position: relative;
            z-index: 2;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            width: 60px;
            height: 60px;
            background: #1f4e79;
            color: white;
            border-radius: 10px;
            margin: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(31,78,121,0.3);
        }

        .header h1 {
            margin-top: 15px;
            color: #1f4e79;
            font-size: 24px;
        }

        .header p {
            color: #777;
            font-size: 13px;
            margin-top: 6px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
            color: #243b53;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5d9de;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #1f4e79;
            box-shadow: 0 0 0 3px rgba(31,78,121,0.12);
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            border: none;
            border-radius: 6px;
            background: #1f4e79;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #163a5c;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(31,78,121,0.3);
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #999;
            font-size: 12px;
        }

.register-text {
    text-align: center;
    margin-top: 18px;
    font-size: 13px;
    color: #777;
}

.register-text a {
    color: #1f4e79;
    font-weight: bold;
    text-decoration: none;
}

.register-text a:hover {
    text-decoration: underline;
}

.password-wrapper {
    position: relative;
}

.password-wrapper input {
    padding-right: 44px;
}

.toggle-password {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);

    width: auto;
    margin: 0;
    padding: 6px 8px;

    background: none;
    border: none;
    box-shadow: none;

    font-size: 17px;
    line-height: 1;
    color: #8a97a6;
    cursor: pointer;
}

.toggle-password:hover {
    background: none;
    color: #1f4e79;
    transform: translateY(-50%);
    box-shadow: none;
}

.toggle-password svg {
    display: block;
}

.forgot-row {
    text-align: right;
    margin-top: 8px;
}

.forgot-row a {
    font-size: 12px;
    color: #1f4e79;
    font-weight: bold;
    text-decoration: none;
}

.forgot-row a:hover {
    text-decoration: underline;
}

.reset-subtitle {
    color: #777;
    font-size: 13px;
    margin: -8px 0 4px;
}
    </style>

   


</head>


<body>


    <div class="login-box">

        <div class="header">

            <div class="logo">GCD</div>

            <h1>GARDNER COLLEGE LIBRARY</h1>

            <p>Web-Based Book Borrowing System</p>

        </div>


        <!-- LOGIN VIEW -->
        <div id="loginView">

            <form onsubmit="login(); return false;">

                <label>Username</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    required
                >


                <label>Password</label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('password', this)"
                    >
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>

                </div>

                <div class="forgot-row">
                    <a href="#" onclick="showReset(); return false;">
                        Forgot your password?
                    </a>
                </div>


                <button type="submit">
                    Login
                </button>

                <p class="register-text">
                    Don't have an account?
                    <a href="register.html">Create an account</a>
                </p>

            </form>

        </div>


        <!-- FORGOT PASSWORD / RESET VIEW -->
        <div id="resetView" style="display: none;">

            <p class="reset-subtitle">
                Enter your username and we'll send a password reset
                link to the email address on your account.
            </p>

            <form onsubmit="resetPassword(); return false;">

                <label>Username</label>

                <input
                    type="text"
                    id="resetUsername"
                    placeholder="Enter your username"
                    required
                >


                <button type="submit">
                    Send Reset Link
                </button>

                <p class="register-text">
                    Remembered your password?
                    <a href="#" onclick="showLogin(); return false;">Back to Sign In</a>
                </p>

            </form>

        </div>


        <div class="footer">
            GARDNER COLLEGE LIBRARY
        </div>

    </div>


    <script>

        /* SHOW / HIDE PASSWORD */

        var eyeOpenIcon =
            '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';

        var eyeOffIcon =
            '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.8 21.8 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.77 21.77 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';


        function togglePassword(inputId, button) {

            var input =
                document.getElementById(inputId);


            if (input.type === "password") {

                input.type = "text";
                button.innerHTML = eyeOffIcon;

            }

            else {

                input.type = "password";
                button.innerHTML = eyeOpenIcon;

            }

        }


        /* SWITCH BETWEEN LOGIN AND FORGOT-PASSWORD VIEWS */

        function showReset() {

            document.getElementById("loginView").style.display = "none";
            document.getElementById("resetView").style.display = "block";

        }

        function showLogin() {

            document.getElementById("resetView").style.display = "none";
            document.getElementById("loginView").style.display = "block";

        }

    </script>


    <script type="module">

        import { auth, db } from "./firebase-init.js";
        import { signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";


        /* Login is by username, but Firebase Auth needs an email,
           so look up the email that's on file for that username. */

        async function findEmailByUsername(username) {

            var snap =
                await getDoc(doc(db, "usernames", username.toLowerCase()));

            if (!snap.exists()) {

                return null;

            }

            return snap.data().email;

        }


        window.login = async function () {

            var username =
                document.getElementById("username").value.trim();

            var password =
                document.getElementById("password").value;

            try {

                var email =
                    await findEmailByUsername(username);

                if (!email) {

                    alert("Username or password is incorrect!");

                    return;

                }

                var cred =
                    await signInWithEmailAndPassword(auth, email, password);

                var me =
                    await getDoc(doc(db, "users", cred.user.uid));

                window.location.href =
                    (me.exists() && me.data().role === "admin") ? "admin.html" : "dashboard.html";

            }

            catch (error) {

                alert("Username or password is incorrect!");

            }

        };


        window.resetPassword = async function () {

            var username =
                document.getElementById("resetUsername").value.trim();

            try {

                var email =
                    await findEmailByUsername(username);

                if (!email) {

                    alert("No account found with that username.");

                    return;

                }

                await sendPasswordResetEmail(auth, email);

                alert("A password reset link has been sent to the email on file for that account.");

                showLogin();

            }

            catch (error) {

                alert("Could not send reset email: " + error.message);

            }

        };

    </script>

</body>

</html>
